<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shivam's Services 💎</title>
    <style>
        :root {
            --primary: #00f2fe;
            --bg-color: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-color);
            background-image: radial-gradient(circle at top right, #1e293b, transparent),
                              radial-gradient(circle at bottom left, #334155, transparent);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Header Animations */
        header {
            text-align: center;
            margin-top: 50px;
            animation: fadeInDown 1s ease-out;
        }

        h1 {
            font-size: 3rem;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        /* Profile Image Setup */
        .profile-container {
            margin: 20px 0;
            animation: pulse 2s infinite alternate;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid var(--primary);
            object-fit: cover;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
        }

        /* Pricing Container */
        .pricing-container {
            display: flex;
            gap: 30px;
            margin-top: 40px;
            padding: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Animated Cards */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            width: 300px;
            transition: all 0.4s ease;
            animation: fadeInUp 1s ease-out backwards;
        }

        /* Staggered load for cards */
        .card:nth-child(1) { animation-delay: 0.2s; }
        .card:nth-child(2) { animation-delay: 0.4s; }
        .card:nth-child(3) { animation-delay: 0.6s; }

        .card:hover {
            transform: translateY(-15px);
            border-color: var(--primary);
            box-shadow: 0 15px 30px rgba(0, 242, 254, 0.2);
        }

        .card h2 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #e2e8f0;
        }

        .price {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 30px;
        }

        /* Buy Button */
        .buy-btn {
            display: inline-block;
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            color: #0f172a;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .buy-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px var(--primary);
        }

        /* Keyframes for animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            from { box-shadow: 0 0 10px rgba(0, 242, 254, 0.2); }
            to { box-shadow: 0 0 25px rgba(0, 242, 254, 0.6); }
        }
    </style>
</head>
<body>

    <header>
        <h1>Shivam's Services 💎</h1>
        <div class="profile-container">
            <!-- Replace 'your-image.jpg' with the actual image file name -->
            <img src="your-image.jpg" alt="Shivam" class="profile-img">
        </div>
    </header>

    <div class="pricing-container">
        <!-- Tier 1 -->
        <div class="card">
            <h2>Starter Tier</h2>
            <div class="price">₹199</div>
            <a href="https://wa.me/91XXXXXXXXXX" target="_blank" class="buy-btn">Buy Service</a>
        </div>

        <!-- Tier 2 -->
        <div class="card">
            <h2>Standard Tier</h2>
            <div class="price">₹299</div>
            <a href="https://wa.me/91XXXXXXXXXX" target="_blank" class="buy-btn">Buy Service</a>
        </div>

        <!-- Tier 3 -->
        <div class="card">
            <h2>Premium Tier</h2>
            <div class="price">₹499</div>
            <a href="https://wa.me/91XXXXXXXXXX" target="_blank" class="buy-btn">Buy Service</a>
        </div>
    </div>

</body>
</html>
